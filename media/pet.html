<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { height: 100%; }
  body { margin: 0; padding: 8px 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; font-family: var(--vscode-font-family); font-size: 12px; color: var(--vscode-foreground); user-select: none; }
  body > * { flex: none; }
  html, body { overflow: hidden; }
  .stage { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  canvas { image-rendering: pixelated; }
  .bubble { position: absolute; top: 0; left: 50%; transform: translateX(-50%); max-width: 92%; padding: 6px 9px; border-radius: 10px;
    background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-editorWidget-border, #555);
    line-height: 1.35; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
  .bubble.show { opacity: 1; }
  .fx { position: absolute; font-size: 14px; animation: float 1.6s ease-out forwards; pointer-events: none; }
  @keyframes float { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
  .petname { text-align:center; opacity:.7; font-size:11px; cursor:pointer; margin-top:2px; }
  .petname:hover { opacity:1; text-decoration: underline; }
  .breath { text-align: center; height: 18px; margin-top: 4px; font-weight: 600; letter-spacing: .5px; color: var(--vscode-textLink-foreground); }
  .stats { display: flex; justify-content: space-around; margin: 8px 0; opacity: .85; }
  .stats div { text-align: center; } .stats b { display: block; font-size: 14px; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; padding: 5px 4px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .breath:empty { display: none; }
  .intent { margin-top: 6px; text-align: center; font-size: 11px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
  .intent:hover { opacity: 1; text-decoration: underline; }
  .intent.none { color: var(--vscode-textLink-foreground); }
  /* Short panel: pet on the left; intention, stats and buttons stacked on the right. */
  @media (max-height: 240px) {
    body { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr auto;
      grid-template-areas: "pet intent" "pet stats" "pet buttons"; column-gap: 12px; padding: 8px 10px; }
    .intent { grid-area: intent; margin: 2px 0 0; text-align: left; }
    .stage { grid-area: pet; }
    .petname { display: none; }
    /* While breathing, the countdown takes the stats' place. */
    .breath { grid-area: stats; height: auto; margin: 0 0 6px; align-self: center; text-align: left; font-size: 12px; line-height: 1.4; }
    .breath:not(:empty) + .stats { display: none; }
    .stats { grid-area: stats; margin: 0 0 8px; flex-direction: column; justify-content: center; gap: 4px; font-size: 11px; }
    .stats div { text-align: left; opacity: .75; }
    .stats b { display: inline; font-size: 13px; margin-right: 4px; opacity: 1; }
    .row { grid-area: buttons; gap: 6px; }
    button { padding: 4px; font-size: 13px; white-space: nowrap; }
    .lbl { display: none; }
    .bubble { position: fixed; top: 6px; left: 8px; right: 8px; transform: none; max-width: none; font-size: 11px; padding: 4px 8px; line-height: 1.3; z-index: 1; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bubble" id="bubble"></div>
    <canvas id="pet"></canvas>
  </div>
  <div class="petname" id="petName" title="Click to change pet"></div>
  <div class="intent none" id="intent" title="Start a mindful session">＋ Set an intention</div>
  <div class="breath" id="breath"></div>
  <div class="stats">
    <div><b id="focus">0m</b>focus</div>
    <div><b id="today">0m</b>today</div>
    <div><b id="breaks">0</b>breaks</div>
  </div>
  <div class="row">
    <button id="btnBreathe" title="Breathe with me (1 min)">🍃<span class="lbl"> Breathe</span></button>
    <button id="btnBreak" class="primary" title="Take a break">☕<span class="lbl"> Break</span></button>
  </div>

let PX = 6;
// Size the pet to the panel. Whole-pixel sizes keep the art crisp; 19x20 cells leave room for hops and breathing.
function fit() {
  PX = Math.max(1, Math.floor(Math.min(stage.clientWidth / 19, stage.clientHeight / 20)));
  cvs.width = 19 * PX; cvs.height = 20 * PX;
}
new ResizeObserver(fit).observe(stage);

let lastTyping = Date.now() - 2000; // start idle, not bouncing
let blinkUntil = 0, nextBlink = Date.now() + 3000;
let hopT = 0;              // hop animation start
let breathing = null;      // {start, cycles}
let onBreak = false;

  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const now = Date.now();

  if (!breathing && !onBreak && mood !== 'happy' && mood !== 'stretch' && mood !== 'calm') {
    const idleFor = now - lastTyping;
    mood = idleFor < 1500 ? 'typing' : idleFor > 3 * 60 * 1000 ? 'sleepy' : 'idle';
  }

  let sx = 1, sy = 1, dy = 0, leafSway = 0;
  if (now > nextBlink) { blinkUntil = now + 140; nextBlink = now + 2500 + Math.random() * 4000; }
  let eyesClosed = now < blinkUntil;
  let mouth = 'm';

  if (breathing) {
    // Box breathing: 4s in, 4s hold, 4s out, 4s hold
    const el = (now - breathing.start) / 1000;
    const cycle = el % 16, n = Math.floor(el / 16);
    if (n >= breathing.cycles) { breathing = null; breathEl.textContent = ''; mood = 'happy'; say('Nice. Notice how you feel. 🌿'); setTimeout(()=> mood='idle', 4000); }
    else {
      let k, label;
      if (cycle < 4) { k = cycle / 4; label = 'breathe in… ' + (4 - Math.floor(cycle)); }
      else if (cycle < 8) { k = 1; label = 'hold… ' + (8 - Math.floor(cycle)); }
      else if (cycle < 12) { k = 1 - (cycle - 8) / 4; label = 'breathe out… ' + (12 - Math.floor(cycle)); }
      else { k = 0; label = 'hold… ' + (16 - Math.floor(cycle)); }
      const e = 0.5 - Math.cos(k * Math.PI) / 2;
      sx = 1 + e * 0.12; sy = 1 + e * 0.12;
      eyesClosed = true;
      breathEl.textContent = label + `  (${n + 1}/${breathing.cycles})`;
    }
  } else if (mood === 'typing') {
    dy = -Math.abs(Math.sin(t / 110)) * 4; leafSway = Math.sin(t / 90) * 1.5;
  } else if (mood === 'sleepy') {
    eyesClosed = true; sy = 1 + Math.sin(t / 900) * 0.03; sx = 1 - Math.sin(t / 900) * 0.02;
    if (Math.random() < 0.006) fx('💤');
  } else if (mood === 'stretch') {
    sy = 1 + (Math.sin(t / 500) + 1) * 0.08; sx = 1 - (Math.sin(t / 500) + 1) * 0.04; leafSway = Math.sin(t / 300) * 2;
  } else if (mood === 'happy') {
    dy = -Math.abs(Math.sin(t / 200)) * 6; eyesClosed = false; mouth = 'w';
  } else {
    dy = Math.sin(t / 700) * 1.5; leafSway = Math.sin(t / 1200) * 1;
  }

  if (hopT) {
    const p = (now - hopT) / 450;
    if (p >= 1) hopT = 0; else dy -= Math.sin(p * Math.PI) * 14;
  }
  dy *= PX / 6; leafSway *= PX / 6; // motion was tuned for 6px cells

  // Any grid size is stretched to 16 cells wide; `aspect` is a cell's height/width (1 = square).
  const rows = SPRITE.length, cols = SPRITE[0].length, unit = 16 * PX / cols;
  const pw = unit * sx, ph = unit * (SPR.aspect || 1) * sy;
  const w = cols * pw, h = rows * ph;
  const ox = (cvs.width - w) / 2, oy = cvs.height - h + dy;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let ch = SPRITE[r][c];
      if (ch === '.') continue;
      if (ch === 'e' && eyesClosed) ch = r === LAST_EYE_ROW && EYE_ROWS.length > 1 ? 'e' : SPR.lid;
      if (ch === 'm' && mouth === 'w') ch = SPR.lid;
      const x = ox + (r < SPR.sway ? leafSway : 0);
      const x0 = Math.round(x + c * pw), y0 = Math.round(oy + r * ph);
      ctx.fillStyle = PAL[ch];
      ctx.fillRect(x0, y0, Math.round(x + (c + 1) * pw) - x0, Math.round(oy + (r + 1) * ph) - y0);
    }
  }
  if (mouth === 'w' && MOUTH) { // open smile
    ctx.fillStyle = PAL.m;
    const w0 = MOUTH.c1 - MOUTH.c0 + 1;
    ctx.fillRect(Math.round(ox + (MOUTH.c0 - 1) * pw), Math.round(oy + MOUTH.row * ph), Math.ceil(pw * (w0 + 2)), Math.ceil(ph * 0.6));
    ctx.fillRect(Math.round(ox + MOUTH.c0 * pw), Math.round(oy + (MOUTH.row + 0.6) * ph), Math.ceil(pw * w0), Math.ceil(ph * 0.6));
  }
  requestAnimationFrame(draw);
}

let bubbleTimer;
function say(text, ms = 9000) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}
function fx(ch) {
  const s = document.createElement('span');
  s.className = 'fx'; s.textContent = ch;
  s.style.left = (45 + Math.random() * 20) + '%'; s.style.bottom = Math.round(cvs.height * 0.8) + 'px';
  stage.appendChild(s); setTimeout(() => s.remove(), 1700);
}
function setMood(m, ms = 6000) {
  mood = m;
  if (m !== 'idle' && !onBreak) setTimeout(() => { if (mood === m && !onBreak) mood = 'idle'; }, ms);
}
function startBreathing(cycles = 4) {
  breathing = { start: Date.now(), cycles };
  say('Follow me: in through the nose, slow out through the mouth.', 5000);
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (m.type === 'typing') { lastTyping = Date.now(); if (Math.random() < 0.04) fx('✨'); }
  else if (m.type === 'saved') { hopT = Date.now(); if (Math.random() < 0.3) fx('💚'); }
  else if (m.type === 'say') { say(m.text); if (m.mood) setMood(m.mood); }
  else if (m.type === 'mood') setMood(m.mood, 15000);
  else if (m.type === 'pet') setPet(m.id);
  else if (m.type === 'breathe') startBreathing(m.cycles);
  else if (m.type === 'stats') {
    document.getElementById('focus').textContent = m.focus;
    document.getElementById('today').textContent = m.today;
    document.getElementById('breaks').textContent = m.breaks;
    const it = document.getElementById('intent');
    it.textContent = m.intention ? '🎯 ' + m.intention : '＋ Set an intention';
    it.title = m.intention ? m.intention + ' (click to change or end the session)' : 'Start a mindful session';
    it.classList.toggle('none', !m.intention);
    onBreak = m.onBreak;
    const btn = document.getElementById('btnBreak');
    if (onBreak) { mood = 'stretch'; btn.title = 'End break'; btn.textContent = `⏎ ${Math.floor(m.breakLeft/60)}:${String(m.breakLeft%60).padStart(2,'0')}`; }
    else { btn.title = 'Take a break'; btn.innerHTML = '☕<span class="lbl"> Break</span>'; }
  }
});

document.getElementById('btnBreathe').onclick = () => startBreathing(4);
document.getElementById('btnBreak').onclick = () => vscode.postMessage({ type: onBreak ? 'endBreak' : 'startBreak' });
cvs.onclick = () => { hopT = Date.now(); fx('💚'); };
cvs.ondblclick = () => vscode.postMessage({ type: 'choosePet' });
cvs.title = 'Click to pet · double-click to change pet';

document.getElementById('intent').onclick = () => vscode.postMessage({ type: 'intent' });
document.getElementById('petName').onclick = () => vscode.postMessage({ type: 'choosePet' });
setPet('clawd');
requestAnimationFrame(draw);
vscode.postMessage({ type: 'ready' });
</script>
